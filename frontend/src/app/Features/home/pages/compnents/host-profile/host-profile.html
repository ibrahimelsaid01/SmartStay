<div class="card p-4 rounded-4">
  <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
    <div class="min-width-0">
      <h6 class="text-muted mb-1">
        Hosted by
      </h6>

      <h5 class="fw-bold mb-1 text-break">
        {{ displayName }}
      </h5>

      <p
        class="small text-muted mb-0"
        [attr.aria-label]="'Host location: ' + location"
      >
        <i
          class="fa-solid fa-location-dot me-1"
          aria-hidden="true"
        ></i>

        {{ location }}
      </p>
    </div>

    <img
      [src]="profileImageUrl"
      [alt]="displayName + ' profile photo'"
      class="rounded-circle flex-shrink-0"
      width="64"
      height="64"
      style="object-fit: cover;"
    >
  </div>

  <hr class="my-3">

  <p class="small text-muted mb-4 lh-base host-bio">
    {{ bio }}
  </p>

  <button
    type="button"
    class="btn btn-info text-white w-100 mb-2 py-2 fw-bold"
    (click)="sendMessageToHost()"
  >
    <i
      class="fa-solid fa-envelope me-2"
      aria-hidden="true"
    ></i>

    Send Message
  </button>
</div>
