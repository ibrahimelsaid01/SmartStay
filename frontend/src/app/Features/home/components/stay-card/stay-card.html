<div
  class="stay-card bg-white rounded-4 shadow-sm overflow-hidden position-relative"
>
  <div class="position-relative">
    <img
      [src]="coverImageUrl"
      [alt]="title"
      class="w-100"
      style="height: 220px; object-fit: cover; cursor: pointer"
      (click)="goToDetails()"
    />

    <button
      type="button"
      class="wishlist-btn position-absolute top-0 end-0 m-3 bg-white border-0 d-flex align-items-center justify-content-center rounded-circle shadow-sm"
      style="width: 42px; height: 42px"
      [disabled]="wishlistLoading"
      (click)="toggleWishlist($event)"
      [attr.aria-label]="
        isWishlisted ? 'Remove from wishlist' : 'Add to wishlist'
      "
    >
      <span
        *ngIf="wishlistLoading"
        class="spinner-border spinner-border-sm text-danger"
        aria-hidden="true"
      ></span>

      <i
        *ngIf="!wishlistLoading"
        class="bi"
        [ngClass]="{
          'bi-heart-fill text-danger': isWishlisted,
          'bi-heart text-danger': !isWishlisted,
        }"
      ></i>
    </button>
  </div>

  <div class="p-4">
    <div class="d-flex justify-content-between align-items-start gap-3">
      <div>
        <h5
          class="fw-bold mb-2"
          style="cursor: pointer"
          (click)="goToDetails()"
        >
          {{ title }}
        </h5>

        <p class="text-muted small mb-3">
          <i class="bi bi-geo-alt-fill me-1"></i>
          {{ location }}
        </p>
      </div>

      <div class="fw-bold small">
        <i class="bi bi-star-fill text-warning me-1"></i>
        {{ averageRating }}
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="badge rounded-pill text-dark bg-light">
        <i class="bi bi-people-fill me-1"></i>
        {{ maxGuests }} Guests
      </span>

      <span class="badge rounded-pill text-dark bg-light">
        <i class="bi bi-door-open-fill me-1"></i>
        {{ bedrooms }} BR
      </span>

      <span class="badge rounded-pill text-dark bg-light">
        <i class="bi bi-badge-wc-fill me-1"></i>
        {{ bathrooms }} Baths
      </span>
    </div>

    <hr />

    <div class="d-flex justify-content-between align-items-center gap-3">
      <div class="fw-bold fs-4">
        {{ pricePerNight | number }}
        <span class="fs-6">{{ currency }}</span>
        <span class="text-muted fs-6">/ Night</span>
      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="button" class="btn btn-outline-info flex-fill">
        Find Roommate
      </button>

      <button
        type="button"
        class="btn btn-info text-white flex-fill"
        (click)="goToDetails()"
      >
        <i class="bi bi-lightning-fill me-1"></i>
        Instant Book
      </button>
    </div>
  </div>
</div>
