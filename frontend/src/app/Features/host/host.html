<div class="profile-page-wrapper">

  <div class="d-md-none px-3 pt-3">
    <button class="btn btn-white border  py-2.5 d-flex align-items-center justify-content-between rounded-3 shadow-sm"
      type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarDrawer">
      <span class="fw-semibold text-dark d-flex align-items-center gap-2">
        <i class="bi bi-list fs-5" style="color: #42CCCC;"></i> Profile Menu
      </span>
      <i class="bi bi-chevron-right text-muted small"></i>
    </button>
  </div>

  <div class="container-fluid px-3 px-md-5 my-4 my-md-5">
    <div class="profile-main-layout">

      <div class="desktop-sidebar-container">
        <app-profile-sidebar></app-profile-sidebar>
      </div>

      <div class="flex-grow-1 w-100">
        <router-outlet></router-outlet>
      </div>

    </div>
  </div>


  <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileSidebarDrawer" style="width: 286px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold" style="color: #1a202c;">Menu</h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-3">
      <app-profile-sidebar class="w-100"></app-profile-sidebar>
    </div>
  </div>

</div>
